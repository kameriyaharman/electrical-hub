name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', 'backend/app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK (+ Play Store AAB when the upload key is configured)
        working-directory: android
        env:
          EH_KEYSTORE_B64: ${{ secrets.EH_KEYSTORE_B64 }}
          EH_KEYSTORE_PASSWORD: ${{ secrets.EH_KEYSTORE_PASSWORD }}
          EH_KEY_ALIAS: ${{ secrets.EH_KEY_ALIAS }}
          EH_KEY_PASSWORD: ${{ secrets.EH_KEY_PASSWORD }}
        run: |
          API="${{ vars.API_BASE }}"
          if [ -z "$API" ]; then API=$(grep '^apiBase=' gradle.properties | cut -d= -f2-); fi
          echo "API base: $API"
          TASKS="assembleRelease bundleRelease"
          if [ -n "$EH_KEYSTORE_B64" ]; then
            echo "$EH_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export EH_KEYSTORE="$RUNNER_TEMP/upload.jks"
            TASKS="assembleRelease bundleRelease"
            echo "Signing with the Play upload key"
          else
            echo "No upload key secret — APK and AAB signed with the dev test key (re-sign the AAB with the upload key before Play upload)"
          fi
          set -o pipefail
          gradle $TASKS -PapiBase="$API" --no-daemon --stacktrace 2>&1 | tee ../build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ElectricalHub-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

      - name: Publish APK + log to "apk" branch
        if: always()
        run: |
          mkdir -p out
          tail -n 300 build.log > out/build.log 2>/dev/null || echo "no log" > out/build.log
          cp android/app/build/outputs/apk/release/*.apk out/ElectricalHub.apk 2>/dev/null || true
          cp android/app/build/outputs/bundle/release/*.aab out/ElectricalMarketHub-playstore.aab 2>/dev/null || true
          echo "commit=${GITHUB_SHA} status=${{ job.status }} time=$(date -u +%FT%TZ)" > out/STATUS.txt
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A && git commit -qm "APK build ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
